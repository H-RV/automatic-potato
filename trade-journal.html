<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade Journal</title>
<style>
:root{
  --bg0:#0d1117;--bg1:#161b22;--bg2:#21262d;--bg3:#2d333b;--border:#30363d;
  --green:#3fb950;--green-dim:#0a2212;--green-bright:#56d364;
  --red:#f85149;--red-dim:#2d0f0e;--amber:#e3b341;--blue:#58a6ff;--purple:#bc8cff;
  --text:#e6edf3;--text-dim:#8b949e;--text-muted:#484f58;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-6:24px;
  --fs-1:9px;--fs-2:11px;--fs-3:13px;--fs-4:15px;--fs-5:20px;--fs-6:32px;
  --r-sm:6px;--r-md:8px;--r-pill:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg0);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;font-size:var(--fs-3);line-height:1.5;min-height:100vh}
.app{max-width:1080px;margin:0 auto;padding:var(--sp-4)}

.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-4);padding-bottom:var(--sp-3);border-bottom:1px solid var(--border)}
.htitle{font-size:var(--fs-4);font-weight:600;letter-spacing:-.3px}
.hsub{font-size:var(--fs-1);color:var(--text-muted);margin-top:2px}

.upload-zone{border:1.5px dashed var(--border);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4);text-align:center;cursor:pointer;transition:border-color .15s,background .15s;margin-bottom:var(--sp-2)}
.upload-zone:hover,.upload-zone.over{border-color:var(--green);background:var(--green-dim)}
.upload-label{font-size:var(--fs-2);color:var(--text-dim)}
.upload-sub{font-size:var(--fs-1);color:var(--text-muted);margin-top:2px}
input[type=file]{display:none}
.upload-status{font-size:var(--fs-1);color:var(--text-muted);text-align:center;margin-bottom:var(--sp-4);min-height:14px}

.hero{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--sp-4);margin-bottom:var(--sp-3);text-align:center}
.hero-label{font-size:var(--fs-2);color:var(--text-dim);letter-spacing:1px;font-weight:600;margin-bottom:var(--sp-1)}
.hero-num{font-size:44px;font-weight:800;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
.hero-sub{font-size:var(--fs-2);color:var(--text-muted);margin-top:4px}
.split-row{display:flex;justify-content:center;gap:var(--sp-4);margin-top:var(--sp-3);padding-top:var(--sp-3);border-top:1px solid var(--border);flex-wrap:wrap}
.split-item{text-align:center}
.split-label{font-size:var(--fs-1);color:var(--text-muted);letter-spacing:.5px}
.split-val{font-size:var(--fs-4);font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}

.stat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--sp-2);margin-bottom:var(--sp-3)}
.stat{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r-sm);padding:var(--sp-3) var(--sp-2);text-align:center}
.stat-label{font-size:var(--fs-1);color:var(--text-muted);letter-spacing:.5px;margin-bottom:3px}
.stat-num{font-size:var(--fs-4);font-weight:600;font-variant-numeric:tabular-nums}
.stat-sub{font-size:var(--fs-1);color:var(--text-muted);margin-top:2px}

.section{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--sp-4);margin-bottom:var(--sp-3)}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-3);flex-wrap:wrap;gap:var(--sp-2)}
.section-title{font-size:var(--fs-1);color:var(--text-muted);letter-spacing:.8px}
.toggle{display:flex;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-pill);padding:2px;gap:2px}
.toggle-btn{padding:3px var(--sp-3);border-radius:16px;border:none;font-family:inherit;font-size:var(--fs-1);font-weight:500;letter-spacing:.3px;cursor:pointer;background:transparent;color:var(--text-muted)}
.toggle-btn.active{background:var(--bg3);color:var(--text)}

.chart-wrap{display:flex;align-items:flex-end;gap:3px;height:120px;margin-bottom:var(--sp-2)}
.chart-bar-val{font-size:8px;font-weight:600;margin-bottom:3px;white-space:nowrap}
.chart-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.chart-bar{width:70%;border-radius:2px 2px 0 0;min-height:2px}
.chart-label{font-size:8px;color:var(--text-muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

.bucket-row{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) 0;border-bottom:1px solid var(--border)}
.bucket-row:last-child{border-bottom:none}
.bucket-name{flex:0 0 140px;font-size:var(--fs-2);color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bucket-bar-wrap{flex:1;height:8px;background:var(--bg3);border-radius:4px;overflow:hidden}
.bucket-bar{height:100%;border-radius:4px}
.bucket-val{flex:0 0 80px;text-align:right;font-size:var(--fs-2);font-weight:600;font-variant-numeric:tabular-nums}

.filter-row{display:flex;gap:var(--sp-1);flex-wrap:wrap;margin-bottom:var(--sp-3);align-items:center}
.filter-pill{font-size:var(--fs-1);font-weight:500;padding:4px var(--sp-3);border-radius:var(--r-pill);background:var(--bg2);border:1px solid var(--border);color:var(--text-dim);cursor:pointer;letter-spacing:.3px}
.filter-pill.active{background:var(--bg3);border-color:var(--blue);color:var(--text)}
.filter-pill.month-pos{border-color:rgba(63,185,80,0.4)}
.filter-pill.month-neg{border-color:rgba(248,81,73,0.4)}
.filter-pill.month-pos.active{border-color:var(--green)}
.filter-pill.month-neg.active{border-color:var(--red)}

.search-input{background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:var(--r-pill);font-family:inherit;font-size:var(--fs-2);width:200px}
.search-input:focus{outline:none;border-color:var(--blue)}

table{width:100%;border-collapse:collapse;font-size:var(--fs-2)}
th{text-align:left;font-size:var(--fs-1);color:var(--text-muted);letter-spacing:.5px;padding:var(--sp-1) var(--sp-2);border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap}
th:hover{color:var(--text-dim)}
td{padding:var(--sp-2);border-bottom:1px solid var(--border);white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg2)}
.badge{font-size:8px;font-weight:700;letter-spacing:.5px;padding:2px 7px;border-radius:10px;display:inline-block}
.badge-open{background:var(--blue);color:var(--bg0)}
.badge-closed{background:var(--bg3);color:var(--text-dim)}
.badge-naked{background:var(--red);color:var(--bg0)}
.table-wrap{overflow-x:auto}
.trade-note{background:var(--bg2);border:1px solid var(--border);color:var(--text-dim);padding:3px 8px;border-radius:4px;font-family:inherit;font-size:var(--fs-1);width:130px;transition:border-color .3s}
.trade-note:focus{outline:none;border-color:var(--blue);color:var(--text)}

.gap-note{font-size:var(--fs-1);color:var(--text-muted);line-height:1.6;padding:var(--sp-3);background:var(--bg2);border-radius:var(--r-sm);margin-top:var(--sp-3)}
.empty{text-align:center;padding:var(--sp-6) var(--sp-4);color:var(--text-muted);font-size:var(--fs-3)}
.pos{color:var(--green-bright)}.neg{color:var(--red)}

/* ── Performance block ─────────────────────────────────────────── */
.perf{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:var(--sp-3);overflow:hidden}
.perf-top{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--sp-4);padding:var(--sp-4) var(--sp-4) var(--sp-2);flex-wrap:wrap}
.perf-title{font-size:var(--fs-3);color:var(--text-dim);font-weight:600}
.perf-sub{font-size:var(--fs-2);color:var(--text-muted);margin-top:2px}
.perf-kpis{display:flex;gap:var(--sp-6);flex-wrap:wrap}
.kpi-l{font-size:var(--fs-2);color:var(--text-muted)}
.kpi-v{font-size:var(--fs-5);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.eq-wrap{position:relative;padding:0 var(--sp-4)}
.eq-svg{display:block;width:100%;height:200px}
.dd-svg{display:block;width:100%;height:64px}
.eq-axis{position:absolute;right:calc(var(--sp-4) + 4px);font-size:var(--fs-1);color:var(--text-muted);font-variant-numeric:tabular-nums;pointer-events:none}
.eq-dates{display:flex;justify-content:space-between;font-size:var(--fs-1);color:var(--text-muted);padding:4px var(--sp-4) var(--sp-3)}
.eq-tip{position:absolute;top:6px;pointer-events:none;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm);padding:6px 9px;font-size:var(--fs-2);white-space:nowrap;display:none;z-index:2;font-variant-numeric:tabular-nums}
.eq-cross{position:absolute;top:0;bottom:0;width:1px;background:var(--text-muted);opacity:.5;display:none;pointer-events:none}

.perf-grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--border)}
.pcell{padding:var(--sp-4);border-right:1px solid var(--border)}
.pcell:last-child{border-right:none}
.pcell-h{font-size:var(--fs-2);color:var(--text-dim);font-weight:600;margin-bottom:var(--sp-3)}
.pcell-foot{font-size:var(--fs-2);color:var(--text-muted);margin-top:var(--sp-2);line-height:1.5}

.edge-track{position:relative;height:14px;background:var(--bg3);border-radius:7px;margin:22px 0 8px}
.edge-fill{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.edge-mark{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--text)}
.edge-mark span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:var(--fs-1);color:var(--text-dim);white-space:nowrap;margin-bottom:2px}

.payoff-row{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:6px}
.payoff-l{flex:0 0 58px;font-size:var(--fs-2);color:var(--text-muted)}
.payoff-bar{height:12px;border-radius:3px}
.payoff-v{font-size:var(--fs-2);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

.tape{display:flex;flex-wrap:wrap;gap:2px;margin-bottom:var(--sp-2)}
.tape i{display:block;width:7px;height:18px;border-radius:2px}
.streaks{display:flex;gap:var(--sp-4);font-size:var(--fs-2);color:var(--text-muted)}
.streaks b{font-size:var(--fs-4);font-variant-numeric:tabular-nums}

.perf-strip{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--border)}
.ps{padding:var(--sp-3) var(--sp-2);text-align:center;border-right:1px solid var(--border)}
.ps:last-child{border-right:none}
.ps-l{font-size:var(--fs-1);color:var(--text-muted)}
.ps-v{font-size:var(--fs-4);font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.perf-note{font-size:var(--fs-2);color:var(--amber);padding:0 var(--sp-4) var(--sp-3)}

@media (max-width:720px){
  .perf-grid{grid-template-columns:1fr}
  .pcell{border-right:none;border-bottom:1px solid var(--border)}
  .perf-strip{grid-template-columns:repeat(3,1fr)}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div>
      <div class="htitle">Trade Journal</div>
      <div class="hsub">Parsed from your real IBKR Activity Statement exports</div>
    </div>
  </div>

  <div class="upload-zone" id="drop">
    <div class="upload-label">Drop a CSV here to add trades</div>
    <div class="upload-sub">or click to browse — duplicates are skipped automatically</div>
    <input type="file" id="fileInput" accept=".csv">
  </div>
  <div class="upload-status" id="uploadStatus"></div>

  <div id="content"></div>
</div>

<script>
var drop = document.getElementById('drop');
var fileInput = document.getElementById('fileInput');
var uploadStatus = document.getElementById('uploadStatus');
var content = document.getElementById('content');
var currentData = null;
var periodMode = 'week';
var tickerFilter = 'All';
var statusFilter = 'All';
var searchText = '';
var sortCol = 'date', sortDir = -1;
var selectedMonth = null; // null = not yet set; 'ALL' = lifetime view

drop.addEventListener('click', function(){ fileInput.click(); });
drop.addEventListener('dragover', function(e){ e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', function(){ drop.classList.remove('over'); });
drop.addEventListener('drop', function(e){
  e.preventDefault();
  drop.classList.remove('over');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', function(e){
  if (e.target.files.length) handleFile(e.target.files[0]);
});

function handleFile(file) {
  uploadStatus.textContent = 'Reading ' + file.name + '...';
  var reader = new FileReader();
  reader.onload = function(e) { upload(e.target.result); };
  reader.onerror = function() { uploadStatus.textContent = 'Could not read the file.'; };
  reader.readAsText(file);
}

function upload(csvText) {
  uploadStatus.textContent = 'Uploading...';
  fetch('/api/journal/upload', { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: csvText })
  .then(function(r) {
    if (!r.ok) return r.json().then(function(d){ throw new Error(d.error || ('HTTP ' + r.status)); });
    return r.json();
  })
  .then(function(data) {
    uploadStatus.innerHTML = '<span style="color:var(--green)">Added ' + data.newExecutionsAdded + ' new execution' + (data.newExecutionsAdded===1?'':'s') + '</span>';
    loadSummary();
  })
  .catch(function(err) {
    uploadStatus.innerHTML = '<span style="color:var(--red)">' + err.message + '</span>';
  });
}

var PALETTE = ['#3fb950','#58a6ff','#bc8cff','#e3b341','#f85149','#39d353','#93c5fd','#f0883e','#a5d6ff','#d2a8ff'];
var tickerColorMap = {};
function tickerColor(t) {
  if (!tickerColorMap[t]) {
    var keys = Object.keys(tickerColorMap);
    tickerColorMap[t] = PALETTE[keys.length % PALETTE.length];
  }
  return tickerColorMap[t];
}
var BUCKET_COLORS = { 'CSP':'#3fb950','CC':'#58a6ff','LEAP':'#bc8cff','Put Credit Spread':'#56d364','Call Credit Spread':'#58a6ff' };
function bucketColor(name) {
  if (BUCKET_COLORS[name]) return BUCKET_COLORS[name];
  if (name.indexOf('NAKED') >= 0) return '#f85149';
  return '#484f58';
}

function loadSummary() {
  fetch('/api/journal/summary')
    .then(function(r){ return r.json(); })
    .then(function(data){ currentData = data; render(); })
    .catch(function(err){ content.innerHTML = '<div class="empty">Couldn\'t load the journal — ' + err.message + '</div>'; });
}

function isoWeek(dateStr) {
  var d = new Date(dateStr + 'T00:00:00');
  var day = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - day + 3);
  var firstThu = new Date(d.getFullYear(), 0, 4);
  var week = 1 + Math.round(((d - firstThu) / 86400000 - 3 + ((firstThu.getDay()+6)%7)) / 7);
  return d.getFullYear() + '-W' + String(week).padStart(2,'0');
}

function monthLabel(m) {
  if (m === 'ALL') return 'All Time';
  var parts = m.split('-');
  var names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return names[parseInt(parts[1],10)-1] + ' ' + parts[0];
}

function setMonth(m) { selectedMonth = m; render(); }


// ── PERFORMANCE BLOCK ────────────────────────────────────────────────────────
// Closed trades only, in close-date order. Everything here is derived from
// net P/L per position — no account size needed, so no % returns / CAGR.
function fmt$(v, sign) {
  var a = Math.abs(v), str = a >= 10000 ? (a/1000).toFixed(1)+'k' : a.toFixed(0);
  return (v < 0 ? '−$' : (sign ? '+$' : '$')) + str;
}
function perfStats(journal) {
  var closed = journal.filter(function(j){ return j.status === 'closed' && j.pnl !== 0; })
    .sort(function(a,b){ return (a.closeDate||a.date) < (b.closeDate||b.date) ? -1 : 1; });
  var n = closed.length;
  var wins = closed.filter(function(j){ return j.pnl > 0; });
  var losses = closed.filter(function(j){ return j.pnl < 0; });
  var grossW = wins.reduce(function(s,j){ return s+j.pnl; },0);
  var grossL = -losses.reduce(function(s,j){ return s+j.pnl; },0);
  var avgW = wins.length ? grossW/wins.length : 0, avgL = losses.length ? grossL/losses.length : 0;
  var cum = 0, peak = 0, maxDD = 0, curve = [], dd = [];
  closed.forEach(function(j){
    cum += j.pnl; peak = Math.max(peak, cum);
    var d = cum - peak; maxDD = Math.min(maxDD, d);
    curve.push(cum); dd.push(d);
  });
  var maxW = 0, maxL = 0, rW = 0, rL = 0;
  closed.forEach(function(j){
    if (j.pnl > 0) { rW++; rL = 0; } else { rL++; rW = 0; }
    maxW = Math.max(maxW, rW); maxL = Math.max(maxL, rL);
  });
  function avgHold(arr){ var k = arr.filter(function(j){ return j.daysHeld != null; });
    return k.length ? k.reduce(function(s,j){ return s+j.daysHeld; },0)/k.length : null; }
  return {
    closed: closed, n: n, wins: wins.length, losses: losses.length,
    winRate: n ? wins.length/n : 0,
    breakeven: (avgW+avgL) > 0 ? avgL/(avgW+avgL) : 0,   // win rate needed to break even
    avgW: avgW, avgL: avgL, payoff: avgL ? avgW/avgL : null,
    pf: grossL ? grossW/grossL : null,
    expectancy: n ? (grossW-grossL)/n : 0,
    net: grossW-grossL, maxDD: maxDD, recovery: maxDD ? (grossW-grossL)/-maxDD : null,
    curve: curve, dd: dd, maxWinStreak: maxW, maxLossStreak: maxL,
    holdW: avgHold(wins), holdL: avgHold(losses), current: rW ? {k:'win',n:rW} : {k:'loss',n:rL}
  };
}

function perfHtml(st, label) {
  if (st.n < 2) return '';
  var W = 1000, H = 200, DH = 64;
  var lo = Math.min(0, Math.min.apply(null, st.curve)), hi = Math.max(0, Math.max.apply(null, st.curve));
  var pad = (hi-lo)*0.08 || 1; lo -= pad; hi += pad;
  var x = function(i){ return st.n === 1 ? 0 : i/(st.n-1)*W; };
  var y = function(v){ return H - (v-lo)/(hi-lo)*H; };
  var line = st.curve.map(function(v,i){ return (i?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1); }).join('');
  var area = line + 'L'+W+','+y(0).toFixed(1)+'L0,'+y(0).toFixed(1)+'Z';
  var ddLo = Math.min(-1, st.maxDD);
  var dy = function(v){ return v/ddLo*DH; };
  var ddPath = 'M0,0' + st.dd.map(function(v,i){ return 'L'+x(i).toFixed(1)+','+dy(v).toFixed(1); }).join('') + 'L'+W+',0Z';
  var up = st.net >= 0, col = up ? '#3fb950' : '#f85149';
  var first = st.closed[0], last = st.closed[st.n-1];

  var h = '<div class="perf">';
  h += '<div class="perf-top"><div><div class="perf-title">Equity curve</div><div class="perf-sub">' + label + ', ' + st.n + ' closed trades in close order</div></div>'
    + '<div class="perf-kpis">'
    + '<div><div class="kpi-l">Net</div><div class="kpi-v ' + (up?'pos':'neg') + '">' + fmt$(st.net,true) + '</div></div>'
    + '<div><div class="kpi-l">Max drawdown</div><div class="kpi-v neg">' + fmt$(st.maxDD) + '</div></div>'
    + '<div><div class="kpi-l">Expectancy</div><div class="kpi-v ' + (st.expectancy>=0?'pos':'neg') + '">' + fmt$(st.expectancy,true) + '<span style="font-size:var(--fs-2);color:var(--text-muted);font-weight:500"> /trade</span></div></div>'
    + '</div></div>';

  h += '<div class="eq-wrap" id="eqWrap">'
    + '<div class="eq-axis" style="top:0">' + fmt$(hi) + '</div>'
    + '<div class="eq-axis" style="top:' + (y(0)/H*200 - 6).toFixed(0) + 'px">$0</div>'
    + '<svg class="eq-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'
    + '<defs><linearGradient id="eqg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+col+'" stop-opacity=".28"/><stop offset="1" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>'
    + '<line x1="0" x2="'+W+'" y1="'+y(0).toFixed(1)+'" y2="'+y(0).toFixed(1)+'" stroke="#484f58" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>'
    + '<path d="'+area+'" fill="url(#eqg)"/>'
    + '<path d="'+line+'" fill="none" stroke="'+col+'" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>'
    + '</svg>'
    + '<svg class="dd-svg" viewBox="0 0 '+W+' '+DH+'" preserveAspectRatio="none" aria-label="Drawdown from peak">'
    + '<path d="'+ddPath+'" fill="rgba(248,81,73,.35)" stroke="#f85149" stroke-width="1" vector-effect="non-scaling-stroke"/>'
    + '</svg>'
    + '<div class="eq-cross" id="eqCross"></div><div class="eq-tip" id="eqTip"></div>'
    + '</div>'
    + '<div class="eq-dates"><span>' + (first.closeDate||first.date) + '</span><span>drawdown from peak shown below the curve</span><span>' + (last.closeDate||last.date) + '</span></div>';
  if (st.n < 30) h += '<div class="perf-note">' + st.n + ' trades is a small sample — treat these ratios as directional until you pass about 30.</div>';

  // Edge: actual win rate vs the win rate this payoff needs to break even
  var wr = st.winRate*100, be = st.breakeven*100, edgeOk = wr > be;
  h += '<div class="perf-grid">';
  h += '<div class="pcell"><div class="pcell-h">Edge</div>'
    + '<div class="edge-track"><div class="edge-fill" style="width:'+wr.toFixed(1)+'%;background:'+(edgeOk?'#3fb950':'#f85149')+'"></div>'
    + '<div class="edge-mark" style="left:'+be.toFixed(1)+'%"><span>break-even '+be.toFixed(0)+'%</span></div></div>'
    + '<div style="font-size:var(--fs-5);font-weight:700" class="'+(edgeOk?'pos':'neg')+'">'+wr.toFixed(0)+'% win rate</div>'
    + '<div class="pcell-foot">With your average win and loss, you need '+be.toFixed(0)+'% to break even. '
    + (edgeOk ? 'You are '+(wr-be).toFixed(0)+' points above that line.' : 'You are '+(be-wr).toFixed(0)+' points below it.') + '</div></div>';

  // Payoff: average win vs average loss, drawn to scale
  var mx = Math.max(st.avgW, st.avgL) || 1;
  h += '<div class="pcell"><div class="pcell-h">Payoff</div>'
    + '<div class="payoff-row"><div class="payoff-l">Avg win</div><div class="payoff-bar" style="width:'+(st.avgW/mx*60).toFixed(0)+'%;background:#3fb950"></div><div class="payoff-v pos">'+fmt$(st.avgW,true)+'</div></div>'
    + '<div class="payoff-row"><div class="payoff-l">Avg loss</div><div class="payoff-bar" style="width:'+(st.avgL/mx*60).toFixed(0)+'%;background:#f85149"></div><div class="payoff-v neg">'+fmt$(-st.avgL)+'</div></div>'
    + '<div class="payoff-row" style="margin-top:10px"><div class="payoff-l">Days held</div><div class="payoff-v" style="color:var(--text-dim)">'
    + (st.holdW!=null?'<span class="pos">'+st.holdW.toFixed(1)+'d</span> winners':'') + (st.holdW!=null&&st.holdL!=null?' vs ':'')
    + (st.holdL!=null?'<span class="neg">'+st.holdL.toFixed(1)+'d</span> losers':'') + '</div></div>'
    + '<div class="pcell-foot">Each loss costs '+(st.payoff?(1/st.payoff).toFixed(2):'—')+'× an average win.</div></div>';

  // Trade tape + streaks
  var tape = st.closed.slice(-60).map(function(j){
    var a = Math.min(1, 0.35 + Math.abs(j.pnl)/(mx*1.5));
    return '<i title="'+(j.closeDate||j.date)+' '+j.underlying+' '+fmt$(j.pnl,true)+'" style="background:'+(j.pnl>0?'rgba(63,185,80,'+a+')':'rgba(248,81,73,'+a+')')+'"></i>';
  }).join('');
  h += '<div class="pcell"><div class="pcell-h">Trade tape' + (st.n>60?' (last 60)':'') + '</div><div class="tape">'+tape+'</div>'
    + '<div class="streaks"><div><b class="pos">'+st.maxWinStreak+'</b> best run</div><div><b class="neg">'+st.maxLossStreak+'</b> worst run</div>'
    + '<div><b style="color:var(--text)">'+st.current.n+'</b> current '+st.current.k+(st.current.n===1?'':(st.current.k==='win'?'s':'es'))+'</div></div>'
    + '<div class="pcell-foot">Brighter bars are bigger results.</div></div>';
  h += '</div>';

  h += '<div class="perf-strip">'
    + '<div class="ps"><div class="ps-l">Profit factor</div><div class="ps-v '+(st.pf>=1?'pos':'neg')+'">'+(st.pf!=null?st.pf.toFixed(2):'∞')+'</div></div>'
    + '<div class="ps"><div class="ps-l">Payoff ratio</div><div class="ps-v">'+(st.payoff!=null?st.payoff.toFixed(2):'—')+'</div></div>'
    + '<div class="ps"><div class="ps-l">Recovery factor</div><div class="ps-v">'+(st.recovery!=null?st.recovery.toFixed(1):'—')+'</div></div>'
    + '<div class="ps"><div class="ps-l">Wins / losses</div><div class="ps-v"><span class="pos">'+st.wins+'</span> / <span class="neg">'+st.losses+'</span></div></div>'
    + '<div class="ps"><div class="ps-l">Gross won / lost</div><div class="ps-v"><span class="pos">'+fmt$(st.avgW*st.wins)+'</span> / <span class="neg">'+fmt$(st.avgL*st.losses)+'</span></div></div>'
    + '</div>';
  h += '</div>';
  return h;
}

function wireEquityHover(st) {
  var wrap = document.getElementById('eqWrap'); if (!wrap || st.n < 2) return;
  var tip = document.getElementById('eqTip'), cross = document.getElementById('eqCross');
  wrap.addEventListener('mousemove', function(e){
    var r = wrap.getBoundingClientRect(), padL = 16, w = r.width - 32;
    var f = Math.max(0, Math.min(1, (e.clientX - r.left - padL) / w));
    var i = Math.round(f*(st.n-1)), j = st.closed[i];
    var px = padL + i/(st.n-1)*w;
    cross.style.left = px+'px'; cross.style.display = 'block';
    tip.innerHTML = (j.closeDate||j.date)+'  '+j.underlying+' <span class="'+(j.pnl>0?'pos':'neg')+'">'+fmt$(j.pnl,true)+'</span><br>Running '+fmt$(st.curve[i],true)
      + (st.dd[i]<0?' <span class="neg">('+fmt$(st.dd[i])+' from peak)</span>':'');
    tip.style.display = 'block';
    tip.style.left = Math.min(px+10, r.width - tip.offsetWidth - 4)+'px';
  });
  wrap.addEventListener('mouseleave', function(){ tip.style.display='none'; cross.style.display='none'; });
}

function render() {
  var data = currentData;
  var allJournal = data.journal || [];
  if (!allJournal.length) {
    content.innerHTML = '<div class="empty">No trades yet — drop a CSV above to get started.</div>';
    return;
  }

  var allTimeTotal = allJournal.reduce(function(s,j){ return s+j.pnl; }, 0);
  var months = Array.from(new Set(allJournal.map(function(j){ return j.date.slice(0,7); }))).sort().reverse();
  if (!selectedMonth) selectedMonth = months[0];

  // Real total per month, used to color-code the pills at a glance
  var monthTotals = {};
  months.forEach(function(m){
    monthTotals[m] = allJournal.filter(function(j){ return j.date.slice(0,7)===m; }).reduce(function(s,j){ return s+j.pnl; }, 0);
  });

  var journal = selectedMonth === 'ALL' ? allJournal : allJournal.filter(function(j){ return j.date.slice(0,7) === selectedMonth; });

  var wins = journal.filter(function(j){ return j.pnl > 0; });
  var losses = journal.filter(function(j){ return j.pnl < 0; });
  var winRate = (wins.length+losses.length) > 0 ? Math.round(wins.length/(wins.length+losses.length)*100) : 0;
  var largestWin = wins.length ? Math.max.apply(null, wins.map(function(j){return j.pnl;})) : 0;
  var largestLoss = losses.length ? Math.min.apply(null, losses.map(function(j){return j.pnl;})) : 0;
  var knownHold = journal.filter(function(j){ return j.daysHeld != null; });
  var avgDays = knownHold.length ? (knownHold.reduce(function(s,j){return s+j.daysHeld;},0)/knownHold.length) : null;
  var closedCount = wins.length + losses.length;
  var avgPerTrade = closedCount ? (wins.reduce(function(s,j){return s+j.pnl;},0)+losses.reduce(function(s,j){return s+j.pnl;},0))/closedCount : 0;

  var periodTotal = journal.reduce(function(s,j){ return s+j.pnl; }, 0);
  var netClass = periodTotal >= 0 ? 'pos' : 'neg';
  var html = '';

  // Month selector — "All Time" first, then every real month, color-coded by sign
  html += '<div class="filter-row" style="margin-bottom:var(--sp-2)">';
  html += '<button class="filter-pill' + (selectedMonth==='ALL'?' active':'') + '" onclick="setMonth(\'ALL\')">All Time</button>';
  months.forEach(function(m){
    var cls = monthTotals[m] >= 0 ? 'month-pos' : 'month-neg';
    html += '<button class="filter-pill ' + cls + (m===selectedMonth?' active':'') + '" onclick="setMonth(\'' + m + '\')">' + monthLabel(m) + '</button>';
  });
  html += '</div>';

  html += '<div class="hero"><div class="hero-label">' + monthLabel(selectedMonth).toUpperCase() + ' — NET REALIZED</div>'
    + '<div class="hero-num ' + netClass + '">' + (periodTotal>=0?'+':'') + '$' + periodTotal.toFixed(2) + '</div>'
    + '<div class="hero-sub">' + journal.length + ' positions \u00b7 ' + wins.length + ' wins, ' + losses.length + ' losses</div>';

  if (selectedMonth !== 'ALL') {
    html += '<div style="margin-top:var(--sp-2);font-size:var(--fs-2);color:var(--text-muted)">All-time running total: <span style="color:' + (allTimeTotal>=0?'var(--green-bright)':'var(--red)') + ';font-weight:600">' + (allTimeTotal>=0?'+':'') + '$' + allTimeTotal.toFixed(2) + '</span> across ' + months.length + ' month' + (months.length===1?'':'s') + '</div>';
  }

  // 30/30/40 split — only meaningful on a real profit, shown for whichever period is selected
  if (periodTotal > 0) {
    var tax = periodTotal * 0.30, takeHome = periodTotal * 0.30, reinvest = periodTotal * 0.40;
    html += '<div class="split-row">'
      + '<div class="split-item"><div class="split-label">TAX RESERVE (30%)</div><div class="split-val" style="color:var(--text-dim)">$' + tax.toFixed(2) + '</div></div>'
      + '<div class="split-item"><div class="split-label">TAKE HOME (30%)</div><div class="split-val" style="color:var(--green-bright)">$' + takeHome.toFixed(2) + '</div></div>'
      + '<div class="split-item"><div class="split-label">REINVEST (40%)</div><div class="split-val" style="color:var(--blue)">$' + reinvest.toFixed(2) + '</div></div>'
      + '</div>';
  }
  html += '</div>';

  html += '<div class="stat-grid">'
    + '<div class="stat"><div class="stat-label">WIN RATE</div><div class="stat-num">' + winRate + '%</div><div class="stat-sub">' + closedCount + ' closed</div></div>'
    + '<div class="stat"><div class="stat-label">AVG / TRADE</div><div class="stat-num ' + (avgPerTrade>=0?'pos':'neg') + '">' + (avgPerTrade>=0?'+':'') + '$' + avgPerTrade.toFixed(0) + '</div></div>'
    + '<div class="stat"><div class="stat-label">AVG DAYS HELD</div><div class="stat-num">' + (avgDays!=null ? avgDays.toFixed(1) : '\u2014') + '</div><div class="stat-sub">' + knownHold.length + ' known</div></div>'
    + '<div class="stat"><div class="stat-label">LARGEST WIN</div><div class="stat-num pos">+$' + largestWin.toFixed(0) + '</div></div>'
    + '<div class="stat"><div class="stat-label">LARGEST LOSS</div><div class="stat-num neg">' + largestLoss.toFixed(0) + '</div></div>'
    + '</div>';

  var perf = perfStats(journal);
  html += perfHtml(perf, monthLabel(selectedMonth));

  var periods = {};
  journal.forEach(function(j){
    var key = periodMode==='week' ? isoWeek(j.date) : j.date.slice(0,7);
    periods[key] = (periods[key]||0) + j.pnl;
  });
  var pkeys = Object.keys(periods).sort();
  var maxAbsP = Math.max.apply(null, pkeys.map(function(k){return Math.abs(periods[k]);})) || 1;
  html += '<div class="section"><div class="section-head"><div class="section-title">PREMIUM BY PERIOD</div>'
    + '<div class="toggle"><button class="toggle-btn' + (periodMode==='week'?' active':'') + '" onclick="setPeriod(\'week\')">Week</button><button class="toggle-btn' + (periodMode==='month'?' active':'') + '" onclick="setPeriod(\'month\')">Month</button></div></div>';
  html += '<div class="chart-wrap">';
  pkeys.forEach(function(k){
    var v = periods[k];
    var h = Math.max(4, Math.abs(v)/maxAbsP*80);
    html += '<div class="chart-bar-col"><div class="chart-bar-val" style="color:' + (v>=0?'var(--green-bright)':'var(--red)') + '">' + (v>=0?'+':'') + '$' + v.toFixed(0) + '</div><div class="chart-bar" style="height:' + h + 'px;background:' + (v>=0?'#3fb950':'#f85149') + '" title="' + k + ': $' + v.toFixed(0) + '"></div><div class="chart-label">' + k.replace('2026-','').replace('-W','W') + '</div></div>';
  });
  html += '</div></div>';

  var byTicker = {};
  journal.forEach(function(j){ byTicker[j.underlying] = (byTicker[j.underlying]||0) + j.pnl; });
  var tickers = Object.keys(byTicker).filter(function(t){ return Math.abs(byTicker[t]) > 0.001; }).sort(function(a,b){ return Math.abs(byTicker[b])-Math.abs(byTicker[a]); });
  var maxAbsT = Math.max.apply(null, tickers.map(function(t){return Math.abs(byTicker[t]);})) || 1;

  var byBucket = {};
  journal.forEach(function(j){ var key = j.bucket.replace(' (via roll)',''); byBucket[key] = (byBucket[key]||0) + j.pnl; });
  var buckets = Object.keys(byBucket).filter(function(b){ return Math.abs(byBucket[b]) > 0.001; }).sort(function(a,b){ return Math.abs(byBucket[b])-Math.abs(byBucket[a]); });
  var maxAbsB = Math.max.apply(null, buckets.map(function(b){return Math.abs(byBucket[b]);})) || 1;

  // Full-width, stacked — not side-by-side, so the bars actually get room to show proportional differences
  html += '<div class="section"><div class="section-title" style="margin-bottom:var(--sp-3)">BY TICKER' + (selectedMonth==='ALL'?' — LIFETIME':'') + '</div>';
  tickers.forEach(function(t){
    var v = byTicker[t], pct = Math.abs(v)/maxAbsT*100;
    html += '<div class="bucket-row"><div class="bucket-name">' + t + '</div><div class="bucket-bar-wrap"><div class="bucket-bar" style="width:' + pct + '%;background:' + (v>=0?tickerColor(t):'#f85149') + '"></div></div><div class="bucket-val ' + (v>=0?'pos':'neg') + '">' + (v>=0?'+':'') + '$' + v.toFixed(0) + '</div></div>';
  });
  html += '</div>';

  html += '<div class="section"><div class="section-title" style="margin-bottom:var(--sp-3)">BY STRATEGY' + (selectedMonth==='ALL'?' — LIFETIME':'') + '</div>';
  buckets.forEach(function(b){
    var v = byBucket[b], pct = Math.abs(v)/maxAbsB*100;
    html += '<div class="bucket-row"><div class="bucket-name">' + b + '</div><div class="bucket-bar-wrap"><div class="bucket-bar" style="width:' + pct + '%;background:' + (v>=0?bucketColor(b):'#f85149') + '"></div></div><div class="bucket-val ' + (v>=0?'pos':'neg') + '">' + (v>=0?'+':'') + '$' + v.toFixed(0) + '</div></div>';
  });
  html += '</div>';

  html += '<div class="section"><div class="section-head"><div class="section-title">' + (selectedMonth==='ALL' ? 'ALL TRADES' : monthLabel(selectedMonth).toUpperCase() + ' TRADES') + '</div>'
    + '<input type="text" class="search-input" id="search-input" placeholder="Search ticker or strategy..." value="' + searchText.replace(/"/g,'&quot;') + '" oninput="setSearch(this.value)"></div>';
  html += '<div class="filter-row" id="tickerFilters"></div>';
  html += '<div class="filter-row" id="statusFilters"></div>';
  html += '<div class="table-wrap"><table><thead><tr>'
    + '<th onclick="setSort(\'date\')">DATE</th><th onclick="setSort(\'underlying\')">TICKER</th><th onclick="setSort(\'bucket\')">STRATEGY</th>'
    + '<th>STATUS</th><th onclick="setSort(\'daysHeld\')">DAYS</th><th onclick="setSort(\'pnl\')">P/L</th><th>NOTE</th>'
    + '</tr></thead><tbody id="tradeRows"></tbody></table></div></div>';

  if (data.warnings && data.warnings.length) {
    html += '<div class="gap-note">' + data.warnings.length + ' position' + (data.warnings.length===1?'':'s') + ' opened before your earliest uploaded statement — direction resolved from the CSV\'s Code column, days-held shown as \u2014 for those since the true open date isn\'t in your data yet.</div>';
  }
  html += '<div class="gap-note">Not yet tracked: gross premium generated vs. paid to close (currently net P/L per position only).</div>';

  content.innerHTML = html;
  wireEquityHover(perf);
  renderFilters(journal);
  renderTable(journal);
}

function setPeriod(mode) { periodMode = mode; render(); }
function setSearch(val) { searchText = val; renderTable(getFilteredJournal()); var input = document.getElementById('search-input'); if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); } }

function getFilteredJournal() {
  var allJournal = currentData.journal || [];
  return selectedMonth === 'ALL' ? allJournal : allJournal.filter(function(j){ return j.date.slice(0,7) === selectedMonth; });
}

// Shared save helper — used by each per-trade inline note (the backend just
// stores whatever key it's given; "trade:<legs>" for these).
function saveNoteKey(key, text, callback) {
  fetch('/api/journal/notes', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key: key, text: text })
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    if (!currentData.notes) currentData.notes = {};
    currentData.notes[key] = text;
    if (callback) callback(true);
  })
  .catch(function(){ if (callback) callback(false); });
}

function renderFilters(journal) {
  var tickers = ['All'].concat(Array.from(new Set(journal.map(function(j){return j.underlying;}))).sort());
  var tf = document.getElementById('tickerFilters');
  tf.innerHTML = tickers.map(function(t){
    return '<button class="filter-pill' + (t===tickerFilter?' active':'') + '" onclick="setTickerFilter(\'' + t + '\')">' + t + '</button>';
  }).join('');

  var statuses = ['All','Open','Closed'];
  var sf = document.getElementById('statusFilters');
  sf.innerHTML = statuses.map(function(s){
    return '<button class="filter-pill' + (s===statusFilter?' active':'') + '" onclick="setStatusFilter(\'' + s + '\')">' + s + '</button>';
  }).join('');
}

function setTickerFilter(t) { tickerFilter = t; renderFilters(getFilteredJournal()); renderTable(getFilteredJournal()); }
function setStatusFilter(s) { statusFilter = s; renderFilters(getFilteredJournal()); renderTable(getFilteredJournal()); }
function setSort(col) {
  if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = -1; }
  renderTable(getFilteredJournal());
}

function renderTable(journal) {
  var rows = journal.filter(function(j){
    if (tickerFilter !== 'All' && j.underlying !== tickerFilter) return false;
    if (statusFilter === 'Open' && j.status !== 'open') return false;
    if (statusFilter === 'Closed' && j.status !== 'closed') return false;
    if (searchText) {
      var q = searchText.toLowerCase();
      var hay = (j.underlying + ' ' + j.bucket + ' ' + j.date).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });
  rows.sort(function(a,b){
    var av = a[sortCol], bv = b[sortCol];
    if (av == null) av = sortDir===1 ? Infinity : -Infinity;
    if (bv == null) bv = sortDir===1 ? Infinity : -Infinity;
    if (av < bv) return -1*sortDir; if (av > bv) return 1*sortDir; return 0;
  });
  var tbody = document.getElementById('tradeRows');
  if (!tbody) return;
  tbody.innerHTML = rows.map(function(j){
    var badge = j.status==='open' ? '<span class="badge badge-open">OPEN</span>' : '<span class="badge badge-closed">CLOSED</span>';
    if (j.bucket.indexOf('NAKED')>=0) badge += ' <span class="badge badge-naked">NAKED</span>';
    var days = j.daysHeld != null ? j.daysHeld : (j.status==='open' ? '\u2014' : '?');
    var pnlClass = j.pnl >= 0 ? 'pos' : 'neg';
    var tradeKey = 'trade:' + j.legs.slice().sort().join('|');
    var existingNote = ((currentData.notes && currentData.notes[tradeKey]) || '').replace(/"/g,'&quot;');
    return '<tr><td>' + j.date + '</td><td>' + j.underlying + '</td><td>' + j.bucket.replace(' (via roll)',' \u21bb') + '</td>'
      + '<td>' + badge + '</td><td>' + days + '</td><td class="' + pnlClass + '">' + (j.pnl>=0?'+':'') + '$' + j.pnl.toFixed(2) + '</td>'
      + '<td><input type="text" class="trade-note" placeholder="note..." value="' + existingNote + '" onblur="saveTradeNote(this,\'' + tradeKey.replace(/'/g,"\\'") + '\')"></td></tr>';
  }).join('');
}

function saveTradeNote(inputEl, key) {
  var text = inputEl.value;
  inputEl.style.borderColor = 'var(--amber)';
  saveNoteKey(key, text, function(ok){
    inputEl.style.borderColor = ok ? 'var(--green)' : 'var(--red)';
    setTimeout(function(){ inputEl.style.borderColor = ''; }, 1200);
  });
}

loadSummary();
</script>
</body>
</html>
