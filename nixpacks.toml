# Tells Railway's Nixpacks builder to install Python (for garch_model.py)
# alongside the Node runtime it already detects from package.json.
#
# If you don't already have a nixpacks.toml or railway.json in the repo root,
# drop this file in alongside server.js and package.json.
#
# If you DO already have one of those (check the repo root before adding this)
# — send it to me instead and I'll merge the python packages into it rather
# than you overwriting whatever's already configured.

[phases.setup]
nixPkgs = ["nodejs_18", "python311", "python311Packages.numpy", "python311Packages.scipy"]

[start]
cmd = "node server.js"
